name: Build desktop releases

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
            assets: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - platform: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
            assets: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          - platform: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            assets: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb.sig
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf libfuse2 xdg-utils

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Use the public Cargo registry in CI
        shell: bash
        run: mv src-tauri/.cargo/config.toml src-tauri/.cargo/config.local.toml

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Check release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG" --apply

      - name: Run Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - run: pnpm install --frozen-lockfile --node-linker=hoisted
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test scripts/test-updater-manifest.mjs

      - name: Build the installer
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          args=(--ci --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}')
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            if [[ -z "$TAURI_UPDATER_PUBLIC_KEY" || -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
              echo 'Set TAURI_UPDATER_PUBLIC_KEY (repository variable) and TAURI_SIGNING_PRIVATE_KEY (Actions secret) before publishing a release.' >&2
              exit 1
            fi
            config=$(node -p 'JSON.stringify({ bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey: process.env.TAURI_UPDATER_PUBLIC_KEY.trim(), requireSignedVersion: true } } })')
            args+=(--config "$config")
          fi
          pnpm tauri build "${args[@]}" -- --locked

      - uses: actions/upload-artifact@v4
        with:
          name: huly-desk-${{ matrix.platform }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: huly-desk-*
          path: downloaded

      - name: Publish installers, checksums and updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          while IFS= read -r -d '' source; do
            # GitHub can rename assets when uploading spaces or special characters.
            name=$(printf '%s' "${source##*/}" | LC_ALL=C tr -c 'A-Za-z0-9._-' '.')
            asset="release-assets/$name"
            if [[ -e "$asset" ]]; then
              echo "Duplicate release asset: $asset" >&2
              exit 1
            fi
            cp "$source" "$asset"
          done < <(find downloaded -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.app.tar.gz' -o -name '*.sig' \) -print0)

          node scripts/write-updater-manifest.mjs release-assets "$REPOSITORY" "$RELEASE_TAG"

          cd release-assets
          shopt -s nullglob
          macos=( *.dmg )
          windows=( *.exe )
          debian=( *.deb )
          appimage=( *.AppImage )
          if (( ${#macos[@]} == 0 || ${#windows[@]} == 0 || ${#debian[@]} == 0 || ${#appimage[@]} == 0 )); then
            echo 'One or more platform installers are missing.' >&2
            exit 1
          fi
          installers=( "${macos[@]}" "${windows[@]}" "${debian[@]}" "${appimage[@]}" *.app.tar.gz )
          sha256sum -- "${installers[@]}" > SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; not replacing its assets."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --verify-tag --generate-notes \
            --title "Huly Desk $RELEASE_TAG" "${installers[@]}" *.sig latest.json SHA256SUMS.txt
