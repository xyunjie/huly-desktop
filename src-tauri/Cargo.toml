[package]
name = "huly-desk"
version = "0.1.0"
description = "Huly Desk"
authors = ["Huly Desk"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "huly_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 宏和构建脚本不剥离符号：macOS 上剥离后的 proc-macro dylib 无法加载
[profile.release.build-override]
strip = false
opt-level = 0
