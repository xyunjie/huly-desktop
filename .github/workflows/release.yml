name: Build desktop releases

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
            assets: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
            assets: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - platform: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            assets: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf libfuse2 xdg-utils

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Use the public Cargo registry in CI
        shell: bash
        run: mv src-tauri/.cargo/config.toml src-tauri/.cargo/config.local.toml

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Check release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG" --apply

      - run: pnpm install --frozen-lockfile --node-linker=hoisted
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build the installer
        run: pnpm tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked

      - uses: actions/upload-artifact@v4
        with:
          name: huly-desk-${{ matrix.platform }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: huly-desk-*
          path: downloaded

      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          while IFS= read -r -d '' source; do
            asset="release-assets/${source##*/}"
            if [[ -e "$asset" ]]; then
              echo "Duplicate release asset: $asset" >&2
              exit 1
            fi
            cp "$source" "$asset"
          done < <(find downloaded -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -print0)

          cd release-assets
          shopt -s nullglob
          macos=( *.dmg )
          windows=( *.exe )
          debian=( *.deb )
          appimage=( *.AppImage )
          if (( ${#macos[@]} == 0 || ${#windows[@]} == 0 || ${#debian[@]} == 0 || ${#appimage[@]} == 0 )); then
            echo 'One or more platform installers are missing.' >&2
            exit 1
          fi
          installers=( "${macos[@]}" "${windows[@]}" "${debian[@]}" "${appimage[@]}" )
          sha256sum -- "${installers[@]}" > SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; not replacing its assets."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --verify-tag --generate-notes \
            --title "Huly Desk $RELEASE_TAG" "${installers[@]}" SHA256SUMS.txt
