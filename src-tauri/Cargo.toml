[package]
name = "huly-desk"
version = "1.1.0"
description = "Huly Desk"
authors = ["Huly Desk"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "huly_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
tokio = { version = "1", features = ["time", "net", "sync", "rt-multi-thread"] }
rand = "0.9"
tauri-plugin-single-instance = "2"
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }
toml_edit = "0.25"
tempfile = "3"
semver = "1"
tauri-plugin-updater = "2.14.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 宏和构建脚本不剥离符号：macOS 上剥离后的 proc-macro dylib 无法加载
[profile.release.build-override]
strip = false
opt-level = 0
